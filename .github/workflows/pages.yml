name: PR tracker (GitHub Pages)

# Rebuilds the "Where is my PR?" index and deploys `web/` to GitHub Pages: on every push to main, every 4 hours
# (00:00, 04:00, … UTC), and on manual dispatch by the repository owner.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Anyone with write access can dispatch (or re-run) a workflow; only the owner's manual runs proceed. A re-run
    # keeps the original `actor`, so the re-runner (`triggering_actor`) is checked too.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the token in .git/config while dependency install scripts run.
          persist-credentials: false

      # Per-commit indexer results never go stale, so the cache only ever grows.
      - name: Cache index results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/psvm-index-cache
          key: psvm-index-${{ github.run_id }}
          restore-keys: psvm-index-

      - name: Build index
        run: cargo run --locked --release -- index --out web/public/data --cache-dir target/psvm-index-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: finds Westend upgrades from Subscan instead of searching the chain (see src/index/westend.rs).
          SUBSCAN_API_KEY: ${{ secrets.SUBSCAN_API_KEY }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check index, test and build site
        working-directory: web
        run: |
          npm run check-index
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job deploys, so only it gets the Pages and OIDC permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
